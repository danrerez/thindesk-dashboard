<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Barra de filtros (RF05) compartilhada pelo dashboard e pela lista de chamados.
  As opções dos selects vêm de GET /api/v1/dashboard/filters (preenchidas pelo filters.js).
-->
<form th:fragment="filters(withSearch)" class="card filters" data-filters novalidate>
    <div class="filters__presets" role="group" aria-label="Períodos rápidos">
        <span class="filters__label">Período</span>
        <button type="button" class="chip" data-preset="7">7 dias</button>
        <button type="button" class="chip" data-preset="30">30 dias</button>
        <button type="button" class="chip" data-preset="90">90 dias</button>
        <button type="button" class="chip" data-preset="180">180 dias</button>
        <button type="button" class="chip" data-preset="all">Tudo</button>
    </div>

    <div class="filters__grid">
        <div class="field">
            <label for="f-from">De</label>
            <input type="date" id="f-from" name="from">
        </div>
        <div class="field">
            <label for="f-to">Até</label>
            <input type="date" id="f-to" name="to">
        </div>
        <div class="field">
            <label for="f-status">Situação</label>
            <select id="f-status" name="status" data-options="statuses"><option value="">Todas</option></select>
        </div>
        <div class="field">
            <label for="f-type">Tipo</label>
            <select id="f-type" name="type" data-options="types"><option value="">Todos</option></select>
        </div>
        <div class="field">
            <label for="f-priority">Prioridade</label>
            <select id="f-priority" name="priority" data-options="priorities"><option value="">Todas</option></select>
        </div>
        <div class="field">
            <label for="f-department">Setor</label>
            <select id="f-department" name="department" data-options="departments"><option value="">Todos</option></select>
        </div>
        <div class="field">
            <label for="f-technician">Técnico</label>
            <select id="f-technician" name="technicianId" data-options="technicians">
                <option value="">Todos</option>
                <option value="none">Sem técnico</option>
            </select>
        </div>
        <div class="field" th:if="${withSearch}">
            <label for="f-q">Busca</label>
            <input type="text" id="f-q" name="q" maxlength="80" placeholder="Protocolo, título, pessoa">
        </div>
        <div class="field field--check" th:if="${withSearch}">
            <label class="check"><input type="checkbox" name="overdue" value="true"> Só atrasados</label>
        </div>
    </div>

    <p class="field__error" data-filters-error hidden></p>

    <div class="filters__actions">
        <button type="submit" class="btn btn--primary">Aplicar filtros</button>
        <button type="button" class="btn btn--ghost" data-filters-clear>Limpar</button>
    </div>
</form>
</body>
</html>
