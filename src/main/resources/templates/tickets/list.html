<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{__${theme.layout}__}">
<head>
    <title>Chamados</title>
    <script th:src="@{/js/api.js}" defer></script>
    <script th:src="@{/js/filters.js}" defer></script>
    <script th:src="@{/js/tickets.js}" defer></script>
</head>
<body>
<section layout:fragment="content" class="tickets-page">
    <header class="page__header page__header--split">
        <div>
            <span class="eyebrow">Thindesk</span>
            <h1>Chamados</h1>
            <p class="muted">Consulte, filtre e abra chamados técnicos. Clique no protocolo para ver o detalhe.</p>
        </div>
        <button type="button" class="btn btn--primary" data-new-ticket>Novo chamado</button>
    </header>

    <div th:replace="~{fragments/filters :: filters(true)}"></div>

    <div class="card table-card" data-widget="tickets">
        <div class="table-toolbar">
            <span class="muted small" data-result-count>Carregando...</span>
            <label class="table-toolbar__sort small">
                Ordenar por
                <select data-sort>
                    <option value="openedAt,desc">Mais recentes</option>
                    <option value="openedAt,asc">Mais antigos</option>
                    <option value="dueAt,asc">Prazo mais próximo</option>
                    <option value="resolvedAt,desc">Resolvidos recentemente</option>
                    <option value="protocol,asc">Protocolo</option>
                </select>
            </label>
        </div>
        <table class="table">
            <thead>
            <tr>
                <th>Protocolo</th>
                <th>Título</th>
                <th>Tipo</th>
                <th>Prioridade</th>
                <th>Situação</th>
                <th>Técnico</th>
                <th>Aberto em</th>
                <th>Prazo (SLA)</th>
            </tr>
            </thead>
            <tbody data-rows><tr><td colspan="8" class="muted">Carregando...</td></tr></tbody>
        </table>
        <nav class="pagination" aria-label="Paginação" data-pagination></nav>
    </div>

    <dialog class="dialog" data-new-ticket-dialog aria-labelledby="new-ticket-title">
        <form class="form" data-new-ticket-form novalidate>
            <header class="dialog__header">
                <h2 id="new-ticket-title">Novo chamado</h2>
                <button type="button" class="dialog__close" data-dialog-close aria-label="Fechar">&times;</button>
            </header>
            <div class="alert alert--danger" data-form-error hidden></div>
            <div class="field">
                <label for="n-title">Título</label>
                <input type="text" id="n-title" name="title" maxlength="120" required>
                <p class="field__error" data-error-for="title"></p>
            </div>
            <div class="field">
                <label for="n-description">Descrição do problema</label>
                <textarea id="n-description" name="description" rows="4" maxlength="4000" required></textarea>
                <p class="field__error" data-error-for="description"></p>
            </div>
            <div class="form__row">
                <div class="field">
                    <label for="n-type">Tipo</label>
                    <select id="n-type" name="type" data-options="types" required><option value="">Selecione</option></select>
                    <p class="field__error" data-error-for="type"></p>
                </div>
                <div class="field">
                    <label for="n-priority">Prioridade</label>
                    <select id="n-priority" name="priority" data-options="priorities" required><option value="">Selecione</option></select>
                    <p class="field__error" data-error-for="priority"></p>
                </div>
            </div>
            <div class="form__row">
                <div class="field">
                    <label for="n-requester">Solicitante</label>
                    <input type="text" id="n-requester" name="requesterName" maxlength="80" required>
                    <p class="field__error" data-error-for="requesterName"></p>
                </div>
                <div class="field">
                    <label for="n-email">E-mail do solicitante</label>
                    <input type="email" id="n-email" name="requesterEmail" maxlength="120" required>
                    <p class="field__error" data-error-for="requesterEmail"></p>
                </div>
            </div>
            <div class="form__row">
                <div class="field">
                    <label for="n-department">Setor</label>
                    <select id="n-department" name="department" data-options="departments" required><option value="">Selecione</option></select>
                    <p class="field__error" data-error-for="department"></p>
                </div>
                <div class="field">
                    <label for="n-technician">Técnico (opcional)</label>
                    <select id="n-technician" name="technicianId" data-options="activeTechnicians"><option value="">Sem técnico</option></select>
                    <p class="field__error" data-error-for="technicianId"></p>
                </div>
            </div>
            <div class="dialog__actions">
                <button type="button" class="btn btn--ghost" data-dialog-close>Cancelar</button>
                <button type="submit" class="btn btn--primary">Abrir chamado</button>
            </div>
        </form>
    </dialog>
</section>
</body>
</html>
